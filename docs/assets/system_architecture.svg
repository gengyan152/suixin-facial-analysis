<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <defs>
    <style>
      .font { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1A232C; }
      .zone-title { font-size: 14px; font-weight: 700; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .box-sub { font-size: 11.5px; fill: #526071; }
      .badge { font-size: 11.5px; font-weight: 700; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-green { stroke: #3E6B48; stroke-width: 1.9; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-clay { stroke: #B86545; stroke-width: 1.7; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-blue { stroke: #365C8D; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <marker id="head-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#3E6B48"/>
    </marker>
    <marker id="head-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#B86545"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#365C8D"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect width="1500" height="680" fill="#FFFFFF"/>

  <!-- Main Title Only -->
  <text x="750" y="42" text-anchor="middle" class="font title">系统架构图</text>

  <!-- ==================== ZONE 1: ANDROID CLIENT ==================== -->
  <rect x="28" y="68" width="290" height="584" rx="14" fill="#F2F7F3" stroke="#8FB397" stroke-width="1.6"/>
  <text x="173" y="96" text-anchor="middle" class="font zone-title" fill="#2A5434">Android Client</text>

  <!-- 1.1 CameraX & Gallery -->
  <rect x="48" y="116" width="250" height="66" rx="10" fill="#FFFFFF" stroke="#8FB397" stroke-width="1.4"/>
  <rect x="48" y="116" width="6" height="66" rx="3" fill="#4D8058"/>
  <text x="176" y="144" text-anchor="middle" class="font box-title">CameraX &amp; Gallery</text>
  <text x="176" y="165" text-anchor="middle" class="font box-sub">On-device BlazeFace TFLite</text>

  <line x1="173" y1="182" x2="173" y2="208" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- 1.2 ImagePreprocessor -->
  <rect x="48" y="210" width="250" height="64" rx="10" fill="#FFFFFF" stroke="#8FB397" stroke-width="1.4"/>
  <rect x="48" y="210" width="6" height="64" rx="3" fill="#4D8058"/>
  <text x="176" y="237" text-anchor="middle" class="font box-title">ImagePreprocessor</text>
  <text x="176" y="258" text-anchor="middle" class="font box-sub">EXIF + JPEG (≤ 8 MB)</text>

  <line x1="173" y1="274" x2="173" y2="300" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- 1.3 BackendApiClient -->
  <rect x="48" y="302" width="250" height="68" rx="10" fill="#E6F1E8" stroke="#5E8E69" stroke-width="1.5"/>
  <text x="173" y="331" text-anchor="middle" class="font box-title">BackendApiClient</text>
  <text x="173" y="352" text-anchor="middle" class="font box-sub">Loopback / LAN Only · OkHttp</text>

  <!-- 1.4 Offline Plan B -->
  <rect x="48" y="398" width="250" height="64" rx="10" fill="#FDF7EE" stroke="#D19A66" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="173" y="425" text-anchor="middle" class="font box-title" fill="#8C5320">Offline Plan B</text>
  <text x="173" y="446" text-anchor="middle" class="font box-sub">4 Cached Demo Cases</text>

  <line x1="173" y1="462" x2="173" y2="492" class="arrow-clay" marker-end="url(#head-clay)"/>

  <!-- 1.5 Result Screen -->
  <rect x="48" y="494" width="250" height="134" rx="10" fill="#FFFFFF" stroke="#4D8058" stroke-width="2"/>
  <text x="173" y="528" text-anchor="middle" class="font box-title" fill="#2A5434">AnalysisResultScreen</text>
  <line x1="72" y1="542" x2="274" y2="542" stroke="#D5E3D8" stroke-width="1"/>
  <text x="173" y="566" text-anchor="middle" class="font box-sub">Photo · Beauty · Age · Narrative</text>
  <text x="173" y="589" text-anchor="middle" class="font box-sub">Multi-face Selection</text>
  <text x="173" y="612" text-anchor="middle" class="font box-sub">Rejection Prompts</text>

  <!-- ==================== ZONE 2: LOCAL GPU BACKEND ==================== -->
  <rect x="430" y="68" width="1042" height="584" rx="14" fill="#F3F6FA" stroke="#8FA8C8" stroke-width="1.6"/>
  <text x="951" y="96" text-anchor="middle" class="font zone-title" fill="#23436E">Local Single-GPU FastAPI Backend (workers=1 · In-Memory · 120s TTL)</text>

  <!-- Outbound Transport Bridge -->
  <path d="M 298 336 L 448 336" class="arrow-blue" marker-end="url(#head-blue)"/>
  <rect x="322" y="286" width="102" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="373" y="303" text-anchor="middle" class="font edge-label" fill="#23436E">USB / LAN</text>
  <text x="373" y="319" text-anchor="middle" class="font box-sub">POST /tasks</text>

  <!-- Col 1: Ingest & Queue -->
  <rect x="450" y="298" width="176" height="76" rx="10" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="1.4"/>
  <rect x="450" y="298" width="176" height="24" rx="10" fill="#DCE6F2"/>
  <rect x="450" y="312" width="176" height="10" fill="#DCE6F2"/>
  <text x="538" y="315" text-anchor="middle" class="font badge" fill="#23436E">Memory Decode</text>
  <text x="538" y="344" text-anchor="middle" class="font box-sub">imaging.py</text>
  <text x="538" y="362" text-anchor="middle" class="font box-sub">EXIF · ≤ 1280px</text>

  <line x1="538" y1="298" x2="538" y2="256" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="450" y="120" width="176" height="134" rx="10" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="1.4"/>
  <rect x="450" y="120" width="176" height="24" rx="10" fill="#DCE6F2"/>
  <rect x="450" y="134" width="176" height="10" fill="#DCE6F2"/>
  <text x="538" y="137" text-anchor="middle" class="font badge" fill="#23436E">TaskService</text>
  <text x="538" y="170" text-anchor="middle" class="font box-sub">Bounded Queue (cap=8)</text>
  <text x="538" y="192" text-anchor="middle" class="font box-sub">Single GPU Worker</text>
  <text x="538" y="214" text-anchor="middle" class="font box-sub">Idempotent Request ID</text>
  <text x="538" y="236" text-anchor="middle" class="font box-sub">120s TTL Cleaner</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <path d="M 626 187 L 660 187" class="arrow-blue" marker-end="url(#head-blue)"/>

  <!-- Col 2: Stage 1 Face Gate -->
  <rect x="662" y="120" width="234" height="254" rx="12" fill="#FFFFFF" stroke="#6B90B8" stroke-width="1.5"/>
  <rect x="662" y="120" width="234" height="26" rx="10" fill="#D5E4F4"/>
  <rect x="662" y="136" width="234" height="10" fill="#D5E4F4"/>
  <text x="779" y="138" text-anchor="middle" class="font badge" fill="#1D3E66">Stage 1 · Face Gate</text>

  <rect x="678" y="164" width="202" height="78" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="779" y="195" text-anchor="middle" class="font box-title">MediaPipe + YuNet</text>
  <text x="779" y="218" text-anchor="middle" class="font box-sub">Dual NMS · IoU ≥ 0.3</text>

  <line x1="779" y1="242" x2="779" y2="268" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="678" y="270" width="202" height="84" rx="8" fill="#EEF4FB" stroke="#8FA8C8" stroke-width="1.2"/>
  <text x="779" y="303" text-anchor="middle" class="font box-title">InternVL3-2B Gate</text>
  <text x="779" y="326" text-anchor="middle" class="font box-sub">HUMAN / NON_HUMAN</text>

  <!-- Arrow Col 2 -> Col 3 (1 human) -->
  <path d="M 896 220 L 938 220" class="arrow-green" marker-end="url(#head-green)"/>
  <text x="917" y="210" text-anchor="middle" class="font edge-label" fill="#2A5434">1</text>

  <!-- Col 3: Stage 2 Quality Gate -->
  <rect x="940" y="120" width="218" height="254" rx="12" fill="#FFFFFF" stroke="#6B90B8" stroke-width="1.5"/>
  <rect x="940" y="120" width="218" height="26" rx="10" fill="#D5E4F4"/>
  <rect x="940" y="136" width="218" height="10" fill="#D5E4F4"/>
  <text x="1049" y="138" text-anchor="middle" class="font badge" fill="#1D3E66">Stage 2 · Quality Gate</text>

  <rect x="956" y="164" width="186" height="78" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1049" y="195" text-anchor="middle" class="font box-title">FaceLandmarker</text>
  <text x="1049" y="218" text-anchor="middle" class="font box-sub">3D Pose (Yaw / Pitch)</text>

  <line x1="1049" y1="242" x2="1049" y2="268" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="956" y="270" width="186" height="84" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1049" y="303" text-anchor="middle" class="font box-title">Quality Check</text>
  <text x="1049" y="326" text-anchor="middle" class="font box-sub">Brightness · Blur (quality.py)</text>

  <!-- Arrow Col 3 -> Col 4 -->
  <path d="M 1158 220 L 1196 220" class="arrow-green" marker-end="url(#head-green)"/>
  <text x="1177" y="210" text-anchor="middle" class="font edge-label" fill="#2A5434">Pass</text>

  <!-- Col 4: Stage 3 & 4 Inference -->
  <rect x="1198" y="120" width="254" height="254" rx="12" fill="#FFFFFF" stroke="#5E8E69" stroke-width="1.6"/>
  <rect x="1198" y="120" width="254" height="26" rx="10" fill="#DCEFE0"/>
  <rect x="1198" y="136" width="254" height="10" fill="#DCEFE0"/>
  <text x="1325" y="138" text-anchor="middle" class="font badge" fill="#254C2E">Stage 3 &amp; 4 · Inference</text>

  <!-- Parallel Stage 3 Models -->
  <rect x="1212" y="160" width="110" height="84" rx="8" fill="#F2F8F3" stroke="#97B89E" stroke-width="1.2"/>
  <text x="1267" y="194" text-anchor="middle" class="font box-title">2D-FAP</text>
  <text x="1267" y="216" text-anchor="middle" class="font box-sub">MobileNetV2</text>
  <text x="1267" y="233" text-anchor="middle" class="font box-sub">Beauty (1–5)</text>

  <rect x="1328" y="160" width="110" height="84" rx="8" fill="#EEF4FB" stroke="#8FA8C8" stroke-width="1.2"/>
  <text x="1383" y="194" text-anchor="middle" class="font box-title">APPA-REAL</text>
  <text x="1383" y="216" text-anchor="middle" class="font box-sub">SE-ResNeXt-50</text>
  <text x="1383" y="233" text-anchor="middle" class="font box-sub">Apparent Age</text>

  <!-- Stage 3 -> Stage 4 -->
  <line x1="1325" y1="244" x2="1325" y2="282" class="arrow" marker-end="url(#head-slate)"/>
  <rect x="1276" y="253" width="98" height="16" rx="4" fill="#FFFFFF"/>
  <text x="1325" y="265" text-anchor="middle" class="font badge" fill="#2A5434">scores_ready</text>

  <rect x="1212" y="284" width="226" height="72" rx="8" fill="#F6F3FA" stroke="#A799C7" stroke-width="1.2"/>
  <text x="1325" y="314" text-anchor="middle" class="font box-title">InternVL3-2B + LoRA</text>
  <text x="1325" y="336" text-anchor="middle" class="font box-sub">6-Field Description + Fallback</text>

  <!-- ==================== ROW 2: BRANCH OUTCOMES ==================== -->

  <!-- R-Left: need_selection -->
  <rect x="450" y="446" width="176" height="78" rx="10" fill="#FFF9F0" stroke="#D19A66" stroke-width="1.4"/>
  <text x="538" y="478" text-anchor="middle" class="font box-title" fill="#8C5320">need_selection</text>
  <text x="538" y="501" text-anchor="middle" class="font box-sub">POST /select-face</text>

  <path d="M 702 374 L 702 410 L 538 410 L 538 444" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="598" y="399" width="38" height="18" rx="4" fill="#F3F6FA"/>
  <text x="617" y="412" text-anchor="middle" class="font edge-label" fill="#8C5320">≥ 2</text>

  <!-- R1: Non-human rejection -->
  <rect x="662" y="446" width="234" height="78" rx="10" fill="#FDF3EE" stroke="#C97A5B" stroke-width="1.4"/>
  <text x="779" y="478" text-anchor="middle" class="font box-title" fill="#8C3B20">NO_HUMAN_FACE</text>
  <text x="779" y="501" text-anchor="middle" class="font box-sub">rejected · No Score</text>

  <line x1="779" y1="374" x2="779" y2="444" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="786" y="399" width="20" height="18" rx="4" fill="#F3F6FA"/>
  <text x="796" y="412" text-anchor="middle" class="font edge-label" fill="#8C3B20">0</text>

  <!-- R2: Quality rejection -->
  <rect x="940" y="446" width="218" height="78" rx="10" fill="#FDF3EE" stroke="#C97A5B" stroke-width="1.4"/>
  <text x="1049" y="478" text-anchor="middle" class="font box-title" fill="#8C3B20">Quality Rejected</text>
  <text x="1049" y="501" text-anchor="middle" class="font box-sub">Pose / Blur / Lighting</text>

  <line x1="1049" y1="374" x2="1049" y2="444" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="1056" y="399" width="34" height="18" rx="4" fill="#F3F6FA"/>
  <text x="1073" y="412" text-anchor="middle" class="font edge-label" fill="#8C3B20">Fail</text>

  <!-- R3: Staged Release -->
  <rect x="1198" y="446" width="254" height="78" rx="10" fill="#EAF4EC" stroke="#4D8058" stroke-width="1.5"/>
  <text x="1325" y="478" text-anchor="middle" class="font box-title" fill="#254C2E">Staged Release</text>
  <text x="1325" y="501" text-anchor="middle" class="font box-sub">completed / partial_error</text>

  <line x1="1325" y1="374" x2="1325" y2="444" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- ==================== RETURN BUS ==================== -->
  <line x1="538" y1="524" x2="538" y2="578" class="arrow-blue"/>
  <line x1="779" y1="524" x2="779" y2="578" class="arrow-blue"/>
  <line x1="1049" y1="524" x2="1049" y2="578" class="arrow-blue"/>
  <line x1="1325" y1="524" x2="1325" y2="578" class="arrow-blue"/>
  <path d="M 1325 578 L 300 578" class="arrow-blue" marker-end="url(#head-blue)"/>

  <rect x="318" y="556" width="106" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="371" y="573" text-anchor="middle" class="font edge-label" fill="#23436E">GET /tasks/{id}</text>
  <text x="371" y="589" text-anchor="middle" class="font box-sub">JSON Status</text>
</svg>
