<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; fill: #1A232C; }
      .subtitle { font-size: 13px; fill: #4E5D6C; }
      .zone-title { font-size: 14.5px; font-weight: 700; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #1E293B; }
      .box-text { font-size: 11.5px; fill: #475569; }
      .badge { font-size: 11px; font-weight: 700; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-green { stroke: #3E6B48; stroke-width: 1.9; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-clay { stroke: #B86545; stroke-width: 1.7; fill: none; stroke-dasharray: 5 4; stroke-linejoin: round; stroke-linecap: round; }
      .arrow-blue { stroke: #365C8D; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <marker id="head-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#3E6B48"/>
    </marker>
    <marker id="head-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#B86545"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#365C8D"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect width="1600" height="820" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="800" y="38" text-anchor="middle" class="font title">随心一拍（v1.1）系统总体架构图</text>
  <text x="800" y="61" text-anchor="middle" class="font subtitle">Android 端侧轻量预览 · 本地单 GPU 串行推理闭环（纯内存 120s TTL） · Plan B 离线应急演示</text>

  <!-- ==================== ZONE 1: ANDROID CLIENT ==================== -->
  <rect x="28" y="84" width="320" height="708" rx="14" fill="#F2F7F3" stroke="#8FB397" stroke-width="1.6"/>
  <text x="48" y="112" class="font zone-title" fill="#2A5434">Android 客户端（Kotlin · Compose · CameraX）</text>

  <!-- 1.1 Capture & On-device preview -->
  <rect x="48" y="132" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#8FB397" stroke-width="1.4"/>
  <rect x="48" y="132" width="6" height="84" rx="3" fill="#4D8058"/>
  <text x="66" y="156" class="font box-title">采集与端侧实时预览</text>
  <text x="66" y="177" class="font box-text">• CameraX 实时取景（1280×1600）与相册选图</text>
  <text x="66" y="197" class="font box-text">• MediaPipe BlazeFace TFLite 端侧检测框</text>

  <!-- Arrow 1.1 -> 1.2 -->
  <line x1="188" y1="216" x2="188" y2="244" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- 1.2 ImagePreprocessor -->
  <rect x="48" y="246" width="280" height="78" rx="10" fill="#FFFFFF" stroke="#8FB397" stroke-width="1.4"/>
  <rect x="48" y="246" width="6" height="78" rx="3" fill="#4D8058"/>
  <text x="66" y="270" class="font box-title">ImagePreprocessor 图像规范化</text>
  <text x="66" y="291" class="font box-text">• EXIF 转正 + inSampleSize 单次矩阵缩放</text>
  <text x="66" y="311" class="font box-text">• 内存编码为 JPEG 字节流（≤ 8 MB）</text>

  <!-- Arrow 1.2 -> 1.3 -->
  <line x1="188" y1="324" x2="188" y2="352" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- 1.3 BackendApiClient -->
  <rect x="48" y="354" width="280" height="86" rx="10" fill="#E6F1E8" stroke="#5E8E69" stroke-width="1.5"/>
  <text x="64" y="378" class="font box-title">BackendApiClient 本地网络闭环</text>
  <text x="64" y="399" class="font box-text">• 仅放行回环 / 私网 IP，严格禁用重定向</text>
  <text x="64" y="419" class="font box-text">• 原始字节流上传 + 350ms 轮询 + DELETE 销毁</text>

  <!-- 1.4 Plan B Offline Demo -->
  <rect x="48" y="468" width="280" height="92" rx="10" fill="#FDF7EE" stroke="#D19A66" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="64" y="492" class="font box-title" fill="#8C5320">Plan B · 离线应急演示模式</text>
  <text x="64" y="513" class="font box-text">• 内置 assets/offline_demos/ 4 组本地样例</text>
  <text x="64" y="533" class="font box-text">• 含 2 组人像、狗脸拦截、失焦拦截（零网络）</text>
  <text x="64" y="551" class="font box-text">• 无后端时直达结果页并置顶「示例」标识</text>

  <!-- Arrow 1.4 -> 1.5 -->
  <line x1="188" y1="560" x2="188" y2="588" class="arrow-clay" marker-end="url(#head-clay)"/>

  <!-- 1.5 Result Screen -->
  <rect x="48" y="590" width="280" height="182" rx="10" fill="#FFFFFF" stroke="#4D8058" stroke-width="2"/>
  <text x="188" y="616" text-anchor="middle" class="font box-title" fill="#2A5434">AnalysisResultScreen 单一信笺展示</text>
  <line x1="68" y1="628" x2="308" y2="628" stroke="#D5E3D8" stroke-width="1"/>
  <text x="66" y="651" class="font box-text">• 人像原图展示（无多余网格或热力图叠加）</text>
  <text x="66" y="673" class="font box-text">• 表观年龄（岁）与颜值评分（1.0–5.0 分）</text>
  <text x="66" y="695" class="font box-text">• 一段式连贯中文面容与气质描述</text>
  <text x="66" y="717" class="font box-text">• 多人同框：画框轻点选人（select-face）</text>
  <text x="66" y="739" class="font box-text">• 门禁拦截：手绘插画温和提示重拍</text>
  <text x="66" y="761" class="font box-text">• 退出页面自动触发 DELETE 释放服务端内存</text>

  <!-- ==================== ZONE 2: LOCAL GPU BACKEND ==================== -->
  <rect x="466" y="84" width="1106" height="708" rx="14" fill="#F3F6FA" stroke="#8FA8C8" stroke-width="1.6"/>
  <text x="486" y="112" class="font zone-title" fill="#23436E">本地单 GPU FastAPI 推理后端（workers=1 · 单 GPU 工作线程 · 纯内存无落盘 · 120s TTL）</text>

  <!-- Bridge: Outbound HTTP (Client 1.3 -> Backend Col A Ingest) -->
  <path d="M 328 397 L 482 397" class="arrow-blue" marker-end="url(#head-blue)"/>
  <rect x="352" y="344" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="407" y="362" text-anchor="middle" class="font edge-label" fill="#23436E">USB / 热点</text>
  <text x="407" y="379" text-anchor="middle" class="font box-text">POST /tasks 等</text>

  <!-- Col A (Bottom): Ingest & Decode -> (Top): TaskService Queue -->
  <rect x="486" y="338" width="198" height="124" rx="10" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="1.4"/>
  <rect x="486" y="338" width="198" height="26" rx="10" fill="#DCE6F2"/>
  <rect x="486" y="354" width="198" height="10" fill="#DCE6F2"/>
  <text x="585" y="356" text-anchor="middle" class="font badge" fill="#23436E">接入解码（imaging.py）</text>
  <text x="500" y="384" class="font box-text">• 限制 ≤ 8 MB / ≤ 40MP</text>
  <text x="500" y="404" class="font box-text">• EXIF 转正，长边 ≤ 1280px</text>
  <text x="500" y="424" class="font box-text">• 纯内存解码，无临时文件</text>
  <text x="500" y="444" class="font box-text">• 生成 normalized.jpg 缓存</text>

  <!-- Arrow Ingest -> TaskService -->
  <line x1="585" y1="338" x2="585" y2="294" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="486" y="142" width="198" height="148" rx="10" fill="#FFFFFF" stroke="#8FA8C8" stroke-width="1.4"/>
  <rect x="486" y="142" width="198" height="26" rx="10" fill="#DCE6F2"/>
  <rect x="486" y="158" width="198" height="10" fill="#DCE6F2"/>
  <text x="585" y="160" text-anchor="middle" class="font badge" fill="#23436E">任务调度（service.py）</text>
  <text x="500" y="188" class="font box-text">• 有界队列（cap=8, max=32）</text>
  <text x="500" y="208" class="font box-text">• client_request_id 幂等</text>
  <text x="500" y="228" class="font box-text">• 单 GPU 线程串行执行</text>
  <text x="500" y="248" class="font box-text">• 120s TTL 定时自动清理</text>
  <text x="500" y="268" class="font box-text">• 立即返回 202 task_id</text>

  <!-- Arrow Col A (TaskService) -> Col B (Stage 1) -->
  <path d="M 684 216 L 718 216" class="arrow-blue" marker-end="url(#head-blue)"/>

  <!-- Col B: Stage 1 Dual Detector + VLM Gate -->
  <rect x="720" y="142" width="256" height="320" rx="12" fill="#FFFFFF" stroke="#6B90B8" stroke-width="1.5"/>
  <rect x="720" y="142" width="256" height="28" rx="10" fill="#D5E4F4"/>
  <rect x="720" y="160" width="256" height="10" fill="#D5E4F4"/>
  <text x="848" y="161" text-anchor="middle" class="font badge" fill="#1D3E66">Stage 1 · 双检测器 + VLM 门禁</text>

  <rect x="736" y="186" width="224" height="86" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="748" y="208" class="font box-title">MediaPipe + OpenCV YuNet</text>
  <text x="748" y="228" class="font box-text">• 双检测器各自 NMS</text>
  <text x="748" y="246" class="font box-text">• 一对一关联 IoU ≥ 0.3，短边 ≥ 80px</text>

  <line x1="848" y1="272" x2="848" y2="298" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="736" y="300" width="224" height="114" rx="8" fill="#EEF4FB" stroke="#8FA8C8" stroke-width="1.2"/>
  <text x="748" y="322" class="font box-title">Idiap/FaceLLM-1B（BF16）</text>
  <text x="748" y="342" class="font box-text">• 逐候选裁剪前置枚举判别：</text>
  <text x="748" y="362" class="font box-text">  HUMAN / NON_HUMAN / UNKNOWN</text>
  <text x="748" y="382" class="font box-text">• 仅放行 HUMAN，人宠同框自动滤宠</text>
  <text x="748" y="402" class="font box-text">• 超时或非枚举严格失败关闭</text>

  <text x="848" y="444" text-anchor="middle" class="font edge-label" fill="#23436E">有效人类候选数判定：0 / 1 / ≥2</text>

  <!-- Arrow Col B -> Col C (1 human) -->
  <path d="M 976 262 L 1012 262" class="arrow-green" marker-end="url(#head-green)"/>
  <text x="994" y="252" text-anchor="middle" class="font edge-label" fill="#2A5434">1 人</text>

  <!-- Col C: Stage 2 Pose & Quality Gate -->
  <rect x="1014" y="142" width="246" height="320" rx="12" fill="#FFFFFF" stroke="#6B90B8" stroke-width="1.5"/>
  <rect x="1014" y="142" width="246" height="28" rx="10" fill="#D5E4F4"/>
  <rect x="1014" y="160" width="246" height="10" fill="#D5E4F4"/>
  <text x="1137" y="161" text-anchor="middle" class="font badge" fill="#1D3E66">Stage 2 · 姿态与画质门禁（quality.py）</text>

  <rect x="1030" y="186" width="214" height="104" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1042" y="210" class="font box-title">FaceLandmarker 3D 姿态</text>
  <text x="1042" y="232" class="font box-text">• 匹配选定人脸变换矩阵</text>
  <text x="1042" y="252" class="font box-text">• SVD 去尺度 + RQ 欧拉角分解</text>
  <text x="1042" y="272" class="font box-text">• 阈值：|yaw| ≤ 35°，|pitch| ≤ 30°</text>

  <line x1="1137" y1="290" x2="1137" y2="322" class="arrow" marker-end="url(#head-slate)"/>

  <rect x="1030" y="324" width="214" height="114" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1042" y="348" class="font box-title">光度与清晰度检验</text>
  <text x="1042" y="370" class="font box-text">• 灰度亮度均值：35 – 225</text>
  <text x="1042" y="390" class="font box-text">• Laplacian 方差：≥ 35</text>
  <text x="1042" y="410" class="font box-text">• 不达标返回具体重拍引导码</text>

  <!-- Arrow Col C -> Col D (Pass) -->
  <path d="M 1260 262 L 1296 262" class="arrow-green" marker-end="url(#head-green)"/>
  <text x="1278" y="252" text-anchor="middle" class="font edge-label" fill="#2A5434">通过</text>

  <!-- Col D: Stage 3 & 4 Scoring + Narrative -->
  <rect x="1298" y="142" width="254" height="320" rx="12" fill="#FFFFFF" stroke="#5E8E69" stroke-width="1.6"/>
  <rect x="1298" y="142" width="254" height="28" rx="10" fill="#DCEFE0"/>
  <rect x="1298" y="160" width="254" height="10" fill="#DCEFE0"/>
  <text x="1425" y="161" text-anchor="middle" class="font badge" fill="#254C2E">Stage 3 &amp; 4 · 数值评分与文本描述</text>

  <!-- Stage 3 parallel group -->
  <rect x="1312" y="180" width="226" height="68" rx="8" fill="#F2F8F3" stroke="#97B89E" stroke-width="1.2"/>
  <text x="1324" y="201" class="font box-title">2D-FAP（MobileNetV2）</text>
  <text x="1324" y="220" class="font box-text">• SCUT-FBP5500 Fold 1 权重</text>
  <text x="1324" y="238" class="font box-text">• 40 维 Sigmoid+L1 → 颜值 1–5</text>

  <rect x="1312" y="256" width="226" height="68" rx="8" fill="#EEF4FB" stroke="#8FA8C8" stroke-width="1.2"/>
  <text x="1324" y="277" class="font box-title">APPA-REAL（SE-ResNeXt-50）</text>
  <text x="1324" y="296" class="font box-text">• BGR 0–255 原始输入契约</text>
  <text x="1324" y="314" class="font box-text">• 101 类期望 → 表观年龄估计</text>

  <!-- Stage 3 -> Stage 4 divider label -->
  <line x1="1425" y1="324" x2="1425" y2="362" class="arrow" marker-end="url(#head-slate)"/>
  <rect x="1372" y="331" width="106" height="17" rx="4" fill="#FFFFFF"/>
  <text x="1425" y="344" text-anchor="middle" class="font badge" fill="#2A5434">scores_ready</text>

  <rect x="1312" y="364" width="226" height="86" rx="8" fill="#F6F3FA" stroke="#A799C7" stroke-width="1.2"/>
  <text x="1324" y="385" class="font box-title">FaceLLM-1B 六字段描述</text>
  <text x="1324" y="404" class="font box-text">• 眉/眼/鼻/嘴/轮廓/表情中文观察</text>
  <text x="1324" y="422" class="font box-text">• compose_narrative 合成自然段</text>
  <text x="1324" y="440" class="font box-text">• 超时走受控回退（partial_error）</text>

  <!-- ==================== ROW 2: BRANCH OUTCOMES & RESPONSE BUS ==================== -->

  <!-- R-Left (under Col A): Multi-face Selection -->
  <rect x="486" y="534" width="198" height="122" rx="10" fill="#FFF9F0" stroke="#D19A66" stroke-width="1.4"/>
  <text x="585" y="558" text-anchor="middle" class="font box-title" fill="#8C5320">多人待选（need_selection）</text>
  <text x="500" y="580" class="font box-text">• 返回候选框与预览图 URL</text>
  <text x="500" y="600" class="font box-text">• 接收 POST /select-face</text>
  <text x="500" y="620" class="font box-text">• 凭 face_id 直接续跑</text>
  <text x="500" y="640" class="font box-text">  Stage 2–4（不重传原图）</text>

  <!-- Arrow Col B -> Multi-face Selection -->
  <path d="M 760 462 L 760 498 L 585 498 L 585 532" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="646" y="486" width="52" height="20" rx="4" fill="#F3F6FA"/>
  <text x="672" y="500" text-anchor="middle" class="font edge-label" fill="#8C5320">≥ 2 人</text>

  <!-- R1 (under Col B): Non-human Rejection -->
  <rect x="720" y="534" width="256" height="122" rx="10" fill="#FDF3EE" stroke="#C97A5B" stroke-width="1.4"/>
  <text x="848" y="558" text-anchor="middle" class="font box-title" fill="#8C3B20">非人脸拦截（rejected）</text>
  <text x="736" y="582" class="font box-text">• code: NO_HUMAN_FACE</text>
  <text x="736" y="602" class="font box-text">• message: 「未识别到人脸」</text>
  <text x="736" y="622" class="font box-text">• 狗/猫/动漫/玩偶等绝不出分</text>
  <text x="736" y="642" class="font box-text">• 立即清空图像与所有结果字段</text>

  <!-- Arrow Col B -> R1 -->
  <line x1="848" y1="462" x2="848" y2="532" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="854" y="486" width="38" height="20" rx="4" fill="#F3F6FA"/>
  <text x="873" y="500" text-anchor="middle" class="font edge-label" fill="#8C3B20">0 人</text>

  <!-- R2 (under Col C): Quality Rejection -->
  <rect x="1014" y="534" width="246" height="122" rx="10" fill="#FDF3EE" stroke="#C97A5B" stroke-width="1.4"/>
  <text x="1137" y="558" text-anchor="middle" class="font box-title" fill="#8C3B20">画质门禁拦截（rejected）</text>
  <text x="1030" y="582" class="font box-text">• POOR_LIGHTING（过暗/过曝）</text>
  <text x="1030" y="602" class="font box-text">• IMAGE_TOO_BLURRY（失焦模糊）</text>
  <text x="1030" y="622" class="font box-text">• POSE_TOO_LARGE（偏转过大）</text>
  <text x="1030" y="642" class="font box-text">• FACE_TOO_SMALL（占比过小）</text>

  <!-- Arrow Col C -> R2 -->
  <line x1="1137" y1="462" x2="1137" y2="532" class="arrow-clay" marker-end="url(#head-clay)"/>
  <rect x="1143" y="486" width="48" height="20" rx="4" fill="#F3F6FA"/>
  <text x="1167" y="500" text-anchor="middle" class="font edge-label" fill="#8C3B20">未达标</text>

  <!-- R3 (under Col D): Staged Payload Release -->
  <rect x="1298" y="534" width="254" height="122" rx="10" fill="#EAF4EC" stroke="#4D8058" stroke-width="1.5"/>
  <text x="1425" y="558" text-anchor="middle" class="font box-title" fill="#254C2E">分阶段发布与内存释放</text>
  <text x="1314" y="582" class="font box-text">1. scores_ready：先返回颜值与年龄</text>
  <text x="1314" y="602" class="font box-text">2. completed：补齐六字段中文描述</text>
  <text x="1314" y="622" class="font box-text">   （或 partial_error 保留数值）</text>
  <text x="1314" y="642" class="font box-text">3. 完成后立即释放解码原图数组</text>

  <!-- Arrow Col D -> R3 -->
  <line x1="1425" y1="462" x2="1425" y2="532" class="arrow-green" marker-end="url(#head-green)"/>

  <!-- ==================== RETURN BUS (Row 2 -> Android Result Screen) ==================== -->
  <line x1="585" y1="656" x2="585" y2="718" class="arrow-blue"/>
  <line x1="848" y1="656" x2="848" y2="718" class="arrow-blue"/>
  <line x1="1137" y1="656" x2="1137" y2="718" class="arrow-blue"/>
  <line x1="1425" y1="656" x2="1425" y2="718" class="arrow-blue"/>
  <path d="M 1425 718 L 330 718" class="arrow-blue" marker-end="url(#head-blue)"/>

  <!-- Label on Return Bus -->
  <rect x="352" y="692" width="108" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="406" y="710" text-anchor="middle" class="font edge-label" fill="#23436E">GET /tasks/{id}</text>
  <text x="406" y="727" text-anchor="middle" class="font box-text">JSON 状态响应</text>

  <!-- Subtle footer inside Zone 2 -->
  <text x="1552" y="768" text-anchor="end" class="font box-text">v1.1 精简架构：聚焦人脸门禁、质量校验、颜值/表观年龄评分与 FaceLLM 中文面容描述</text>
</svg>
